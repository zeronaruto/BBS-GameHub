services:
  backend:
    build: ./backend
    volumes:
      - ./backend:/app
      - gamehub_data:/app/instance   # SQLite-Datei bleibt erhalten
    environment:
      - FLASK_APP=app
      - FLASK_ENV=development
      - FLASK_DEBUG=1
    expose:
      - "5001"                       # nur intern erreichbar, nicht vom Host aus
    command: flask run --host=0.0.0.0 --port=5001

  frontend:
    build: ./frontend
    ports:
      - "5000:5000"                  # das ist der einzige Port, den ihr im Browser öffnet
    volumes:
      - ./frontend:/app
    environment:
      - FLASK_APP=app
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - BACKEND_URL=http://backend:5001
    depends_on:
      - backend
    command: flask run --host=0.0.0.0 --port=5000

volumes:
  gamehub_data:
